<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Kalki Simulator: see your shot before you shoot it">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14141c"/><stop offset="1" stop-color="#241812"/></linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff6b4a"/><stop offset="1" stop-color="#ffb547"/></linearGradient>
  </defs>
  <rect width="1280" height="320" rx="24" fill="url(#bg)"/>
  <!-- lens mark -->
  <g transform="translate(140 160)">
    <circle r="62" fill="none" stroke="url(#ac)" stroke-width="14"/>
    <circle r="28" fill="url(#ac)"/>
    <circle r="12" fill="#14141c"/>
    <g stroke="url(#ac)" stroke-width="9" stroke-linecap="round"><path d="M0-86v-18M0 86v18M-86 0h-18M86 0h18"/></g>
  </g>
  <!-- title -->
  <text x="290" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="84" font-weight="800" letter-spacing="10" fill="url(#ac)">KALKI</text>
  <text x="296" y="206" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="600" fill="#f3e9df">Simulator</text>
  <text x="296" y="252" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#a99f96">See your shot before you shoot it.</text>
  <!-- film frame corners -->
  <g stroke="#ffb547" stroke-width="4" fill="none" stroke-linecap="round" opacity=".8">
    <path d="M860 70h-34v34M1236 70h34v34M860 250h-34v-34M1236 250h34v-34" transform="translate(-16 0)"/>
  </g>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" fill="#f3e9df">
    <text x="850" y="140" font-size="22" font-weight="700">Offline  ·  No account needed</text>
    <text x="850" y="176" font-size="22" font-weight="700">18 camera moves  ·  real lenses</text>
    <text x="850" y="212" font-size="22" font-weight="700">Shot list + storyboard PDFs</text>
  </g>
</svg>
